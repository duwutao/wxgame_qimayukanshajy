name: n14 release
on:
  push:
    paths:
      - '.github/workflows/n14-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n14 patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/n14-src.patch 'https://aka.doubaocdn.com/s/0hkIeUxFE2'
          git apply --check /tmp/n14-src.patch
          git apply /tmp/n14-src.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/render-smoke.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html manifest.json project.config.json js/core/state.js js/core/war.js js/scenes/title.js js/scenes/help.js js/scenes/arc.js js/scenes/journal.js tools/build-app.js tools/bundle.js tools/logic-test.js web/index.html web/manifest.json web/game.bundle.js
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'release: 20261125n14 征战汉末 · 任务保护 · 卡点脱困 [skip ci]'
          git push origin HEAD:main
