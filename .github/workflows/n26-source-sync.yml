name: n26 source sync
on:
  push:
    branches: [juqing]
    paths:
      - '.github/workflows/n26-source-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply source patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/juqing-source.patch 'https://aka.doubaocdn.com/s/Fz2kwn3ego'
          git apply --check /tmp/juqing-source.patch
          git apply /tmp/juqing-source.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js tools
          if git diff --cached --quiet; then
            echo 'No source changes'
            exit 0
          fi
          git commit -m 'fix(juqing): sync n26 source [skip ci]'
          git push origin HEAD:juqing
