name: n75 build game_1
on:
  push:
    branches: [game_1]
    paths:
      - '.github/workflows/n75-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n75 source patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/n75-source.patch 'https://aka.doubaocdn.com/s/VUyUPv2Mns'
          git apply --check /tmp/n75-source.patch
          git apply /tmp/n75-source.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Commit n75
        run: |
          node --check web/game.bundle.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/n75-build.yml
          git add index.html web/index.html web/game.bundle.js js/core/economy.js js/core/story.js js/core/war.js js/data/story.js js/scenes/town.js tools/logic-test.js tools/story-test.js
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261128n75 荆州易主士气与玩家募兵 [skip ci]'
          git push origin HEAD:game_1
