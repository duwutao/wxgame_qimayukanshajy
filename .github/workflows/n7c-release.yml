name: n7c release
on:
  push:
    paths:
      - '.github/workflows/n7c-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n7c source patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/n7c-src.patch 'https://aka.doubaocdn.com/s/iuEJACYL1b'
          git apply --check /tmp/n7c-src.patch
          git apply /tmp/n7c-src.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/render-smoke.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Commit bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/game.bundle.js index.html web/index.html js/scenes/map.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'release: 20261125n7c 暂停状态条 [skip ci]'
          git push origin HEAD:main
