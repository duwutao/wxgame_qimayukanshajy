name: game_1 build
on:
  push:
    branches: [game_1]
    paths:
      - '.github/workflows/game_1-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch game_1 source
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/game1-src.tgz 'https://aka.doubaocdn.com/s/8vo4HQqYEe'
          tar -xzf /tmp/game1-src.tgz -C .
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Commit game_1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/story.js js/core/war.js js/data/story.js tools/story-test.js index.html web/index.html web/game.bundle.js
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'build: game_1 荆州史实停战与护君 [skip ci]'
          git push origin HEAD:game_1
