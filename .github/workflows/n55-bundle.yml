name: n55-bundle

on:
  push:
    branches: [juqing]
    paths:
      - '.github/workflows/n55-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0

      - name: Download and apply n55 patch
        run: |
          set -euo pipefail
          curl --http1.1 -L --fail --retry 5 --retry-delay 3 \
            -o /tmp/n55.patch https://dpaste.org/Q9umB/raw/
          echo 'a7b0578ab22dbb706b5d58d96b2d1bdf6d976c574c92f54bf1dbd1c851ad459e  /tmp/n55.patch' | sha256sum -c -
          head -1 /tmp/n55.patch | grep -q '^diff --git'
          git apply --check /tmp/n55.patch
          git apply /tmp/n55.patch

      - name: Build and test
        run: |
          set -euo pipefail
          node tools/bundle.js
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js

      - name: Commit release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/n55-bundle.yml
          git add -A
          git status --short
          git commit -m 'release: 20261127n55 城镇音乐、官渡史实与蜀魏吴战役理由修正 [skip ci]'
          git push origin HEAD:juqing
