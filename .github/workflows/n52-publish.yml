name: n52 publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n52-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update main entry and bundle
        run: |
          curl --http1.1 -L --fail --retry 3 --retry-delay 2 -o web/game.bundle.js 'https://aka.doubaocdn.com/s/hV85uusURZ'
          echo '089d74a5e692482275ffcbc10845cd21b19134074a2f27eaff30842f6a19f78c  web/game.bundle.js' | sha256sum -c -
          sed -i 's/20261127n51/20261127n52/g' index.html web/index.html web/version.txt
          echo '20261127n52' > web/version.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html web/index.html web/game.bundle.js web/version.txt
          if git diff --cached --quiet; then
            echo 'main already n52'
            exit 0
          fi
          git commit -m 'release: 20261127n52 赤壁后半月西凉与 n51 平衡收口'
          git push origin HEAD:main
  juqing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - name: Apply n52 source
        run: |
          curl --http1.1 -L --fail --retry 3 --retry-delay 2 -o /tmp/n52src.tgz 'https://aka.doubaocdn.com/s/X1PjFCxHQr'
          echo 'eb338c8c1e166c10402023966a980baabeb4ed52553effd1b2e5d000ce951024  /tmp/n52src.tgz' | sha256sum -c -
          tar xzf /tmp/n52src.tgz
          ls -l js/core/state.js js/core/story.js web/game.bundle.js
      - name: Commit n52
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'juqing already n52'
            exit 0
          fi
          git commit -m 'release: 20261127n52 赤壁后半月西凉与 n51 平衡收口 [skip ci]'
          git push origin HEAD:juqing
