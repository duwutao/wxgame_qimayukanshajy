name: n72 build game_1

on:
  push:
    branches: [game_1]
    paths:
      - '.github/workflows/n72-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply 20x patch
        run: |
          git apply --check .github/n72.patch
          git apply .github/n72.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build and publish
        run: |
          node tools/bundle.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/scenes/map.js tools/story-test.js tools/render-smoke.js web/game.bundle.js
          git commit -m "n72 将测试倍速改为 20x"
          git push origin HEAD:game_1
