name: bw-sync-g

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bw-g]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release patch
        run: |
          curl -4 -L --fail --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
            -o /tmp/bw-g.patch 'https://aka.doubaocdn.com/s/djvwqpFmDH'
          test -s /tmp/bw-g.patch
          head -1 /tmp/bw-g.patch
      - name: Apply patch and build
        run: |
          git apply --check /tmp/bw-g.patch
          git apply /tmp/bw-g.patch
          node tools/bundle.js
          git config user.name 'bw-release-bot'
          git config user.email 'bw-release-bot@users.noreply.github.com'
          rm -f .github/workflows/bw-sync-g.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo 'no changes'
            exit 0
          fi
          git add -A
          git commit -m 'release: 20261125g 天机简结算文案 [skip ci]'
          git push
