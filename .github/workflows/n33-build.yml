name: n33 build juqing
on:
  push:
    branches: [juqing]
    paths:
      - '.github/workflows/n33-build.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n33 patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/juqing-n33.patch 'https://aka.doubaocdn.com/s/aTbSXxk448'
          git apply --check /tmp/juqing-n33.patch
          git apply /tmp/juqing-n33.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Verify bundle
        run: echo '17d2378b84108c0c8730f85b3c87122709ff1303eabd10e3a72ba657fe88c0ab  web/game.bundle.js' | sha256sum -c -
      - name: Commit n33
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html js/core/state.js js/core/world.js js/data/china.js tools/logic-test.js tools/story-test.js web/game.bundle.js web/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261126n33 征战汉末 juqing [skip ci]'
          git push origin HEAD:juqing
