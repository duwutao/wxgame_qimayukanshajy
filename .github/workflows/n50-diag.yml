name: n50 diag
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n50-diag.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Try push to juqing
        run: |
          rm -rf /tmp/jq
          git clone --depth 1 --branch juqing "https://x-access-token:${GITHUB_TOKEN}@github.com/duwutao/wxgame_qimayukanshajy.git" /tmp/jq > /tmp/diag.txt 2>&1
          echo "clone=$?" >> /tmp/diag.txt
          cd /tmp/jq || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "probe" > ci-probe.txt
          git add ci-probe.txt
          git commit -m 'debug: probe [skip ci]' >> /tmp/diag.txt 2>&1
          echo "commit=$?" >> /tmp/diag.txt
          git push origin HEAD:juqing >> /tmp/diag.txt 2>&1
          echo "push=$?" >> /tmp/diag.txt
      - name: Report
        run: |
          cd "$GITHUB_WORKSPACE"
          cp /tmp/diag.txt diag.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diag.txt
          git commit -m 'debug: n50 juqing 推送诊断 [skip ci]'
          git push origin HEAD:main
