name: bw-sync l
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply l patch and rebuild
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/NklDoq6oHe" -o /tmp/bw-l.patch
          git apply --check /tmp/bw-l.patch
          git apply /tmp/bw-l.patch
          node tools/bundle.js
          node tools/logic-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Commit release and remove temporary workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bw-l-sync.yml
          git add -A
          git commit -m "release: 20261125l 逃遁入城·招兵低兵·俘虏逃遁·交困修复·任务卡·模型放大 [skip ci]"
          git push origin HEAD:main
