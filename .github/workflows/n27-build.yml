name: n27 build juqing
on:
  push:
    branches: [juqing]
    paths:
      - '.github/workflows/n27-build.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n27 patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/juqing-n27.patch 'https://aka.doubaocdn.com/s/aTqTyP38Wd'
          git apply --check /tmp/juqing-n27.patch
          git apply /tmp/juqing-n27.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Commit n27
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js tools web/game.bundle.js web/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261126n27 征战汉末 juqing [skip ci]'
          git push origin HEAD:juqing
