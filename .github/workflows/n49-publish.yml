name: n49 publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n49-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update main entry and bundle
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o web/game.bundle.js 'https://aka.doubaocdn.com/s/FaLHxUbuDe'
          echo 'b9895f0b572fbd55a13f2e85a1c9013abdecc2db7647c3b6b504a73f9d184ab4  web/game.bundle.js' | sha256sum -c -
          sed -i 's/20261126n48/20261127n49/g' index.html web/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html web/index.html web/game.bundle.js
          git commit -m 'release: 20261127n49 校场夺魁与沙盘第三天开战 [skip ci]'
          git push origin HEAD:main
  juqing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - name: Apply n49 source and bundle to juqing
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/n49-src.patch 'https://aka.doubaocdn.com/s/1V2Qkv7KFm'
          git apply --check /tmp/n49-src.patch
          git apply /tmp/n49-src.patch
          curl -L --fail --retry 3 --retry-delay 2 -o web/game.bundle.js 'https://aka.doubaocdn.com/s/FaLHxUbuDe'
          echo 'b9895f0b572fbd55a13f2e85a1c9013abdecc2db7647c3b6b504a73f9d184ab4  web/game.bundle.js' | sha256sum -c -
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Commit n49
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261127n49 校场夺魁与沙盘第三天开战 [skip ci]'
          git push origin HEAD:juqing
