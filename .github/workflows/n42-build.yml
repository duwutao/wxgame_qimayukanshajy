name: n42 build juqing
on:
  push:
    branches: [juqing]
    paths:
      - '.github/workflows/n42-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n42 state hotfix
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/juqing-n42-state.patch 'https://aka.doubaocdn.com/s/GRULQ0tY5J'
          git apply --check /tmp/juqing-n42-state.patch
          git apply /tmp/juqing-n42-state.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Verify bundle
        run: echo 'ee1bcbf6d5a4e6b5805bbd2e68082b9014ed2aaabc242f84b41f4b77b5a9858c  web/game.bundle.js' | sha256sum -c -
      - name: Commit n42 hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/state.js web/game.bundle.js
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'fix: n42 普通领主按自身编制判断满员 [skip ci]'
          git push origin HEAD:juqing
