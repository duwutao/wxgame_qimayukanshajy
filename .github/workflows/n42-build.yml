name: n42 build juqing
on:
  push:
    branches: [juqing]
    paths:
      - '.github/workflows/n42-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n42b patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/juqing-n42b.patch 'https://aka.doubaocdn.com/s/kC0tfDKJE1'
          git apply --check /tmp/juqing-n42b.patch
          git apply /tmp/juqing-n42b.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Verify bundle
        run: echo 'd5d2df9956179fb0d057dac1bd5387591c15e31c5de2c67e4b2f87b5d0150358  web/game.bundle.js' | sha256sum -c -
      - name: Commit n42b
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/core/state.js js/core/war.js js/data/lord-rank.js tools/logic-test.js web/game.bundle.js web/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261126n42b 君主募兵1.5/马韩保城/入川巴西补线 [skip ci]'
          git push origin HEAD:juqing
