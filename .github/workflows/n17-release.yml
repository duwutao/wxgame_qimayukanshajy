name: n17 release
on:
  push:
    paths:
      - '.github/workflows/n17-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n17 patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/n17-src.patch 'https://aka.doubaocdn.com/s/yv6BFnKA41'
          git apply --check /tmp/n17-src.patch
          git apply /tmp/n17-src.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'release: 20261125n17 征战汉末 · 陈留小沛驿道 [skip ci]'
          git push origin HEAD:main
