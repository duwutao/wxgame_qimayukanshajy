name: n43 update juqing source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n43-juqing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - name: Apply n43 final fix and bundle
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/n43-finalfix.patch 'https://aka.doubaocdn.com/s/9s4nIVLiBJ'
          git apply --check /tmp/n43-finalfix.patch
          git apply /tmp/n43-finalfix.patch
          curl -L --fail --retry 3 --retry-delay 2 -o web/game.bundle.js 'https://aka.doubaocdn.com/s/nEwnx3wWmY'
          echo '6ca9b6d454b72b4d421ae238dfccd59c6456f6c8435ea2e108c7918baabe18e6  web/game.bundle.js' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: n43 最终阶段也纳入两年防卡死 [skip ci]'
          git push origin HEAD:juqing
