name: n32 publish main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n32-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Take n32 bundle and entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin juqing
          git checkout origin/juqing -- index.html web/game.bundle.js web/index.html
          echo 'cd35141a995db55eb455a98145af13c31ff092786307821411af0643e317a0cf  web/game.bundle.js' | sha256sum -c -
          git add index.html web/game.bundle.js web/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261126n32 征战汉末 线上发布'
          git push origin HEAD:main
