name: n11 release
on:
  push:
    paths:
      - '.github/workflows/n11-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n11 source patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/n11-src.patch 'https://aka.doubaocdn.com/s/pZOcZSYwJg'
          git apply --check /tmp/n11-src.patch
          git apply /tmp/n11-src.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/render-smoke.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/game.bundle.js index.html web/index.html js/core/state.js js/core/war.js js/core/world.js js/data/china.js js/scenes/map.js js/scenes/town.js tools/logic-test.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'release: 20261125n11 统一战争与酒馆暂停 [skip ci]'
          git push origin HEAD:main
