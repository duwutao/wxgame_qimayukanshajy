name: n42 publish main
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n42-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Take n42 bundle and entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin juqing
          git checkout origin/juqing -- index.html web/game.bundle.js web/index.html
          echo '373d5239312eba705f1fe138241a7322ff3b1d906f50bb3af87545de14178f55  web/game.bundle.js' | sha256sum -c -
          git add index.html web/game.bundle.js web/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261126n42 50人名将榜带兵上限/招兵倍率 线上发布'
          git push origin HEAD:main
