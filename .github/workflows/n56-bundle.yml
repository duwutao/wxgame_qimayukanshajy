name: n56-bundle

on:
  push:
    branches: [juqing]
    paths:
      - '.github/workflows/n56-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0

      - name: Download and apply n56 patch
        run: |
          set -euo pipefail
          curl --http1.1 -L --fail --retry 5 --retry-delay 3 \
            -o /tmp/n56.patch https://dpaste.org/AJ3pn/raw/
          echo '59a01be50f37e7569821743166e5655f29e621580a580ac69726b40f5212a741  /tmp/n56.patch' | sha256sum -c -
          head -1 /tmp/n56.patch | grep -q '^diff --git'
          git apply --check /tmp/n56.patch
          git apply /tmp/n56.patch

      - name: Build and test
        run: |
          set -euo pipefail
          node tools/bundle.js
          node tools/story-test.js
          node tools/logic-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js

      - name: Commit release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/n56-bundle.yml
          git add -A
          git status --short
          git commit -m 'release: 20261127n56 统一背叛门槛与边陲小镇 [skip ci]'
          git push origin HEAD:juqing
