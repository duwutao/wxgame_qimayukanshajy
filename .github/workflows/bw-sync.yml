name: bw-sync i
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply i patch and rebuild
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/NsXVTis0go" -o /tmp/bw-i.patch
          git apply --check /tmp/bw-i.patch
          git apply /tmp/bw-i.patch
          node tools/bundle.js
      - name: Commit release and remove temporary workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bw-sync.yml
          git add -A
          git commit -m "release: 20261125i 天机简加倍·四货市场·匪团翻倍 [skip ci]"
          git push origin HEAD:main
