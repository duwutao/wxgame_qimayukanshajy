name: bw-sync h
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply h patch and rebuild
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/TmuZhndQEp" -o /tmp/bw-h.patch
          git apply --check /tmp/bw-h.patch
          git apply /tmp/bw-h.patch
          node tools/bundle.js
      - name: Commit release and remove temporary workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bw-sync.yml
          git add -A
          git commit -m "release: 20261125h 追击逃遁·徐州袁术·张辽归魏 [skip ci]"
          git push origin HEAD:main
