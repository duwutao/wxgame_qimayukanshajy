name: Sync BW repo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: contains(github.event.head_commit.message, 'BW repo sync')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download bundle
        run: curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://aka.doubaocdn.com/s/NfQijKqUiB' -o /tmp/bw.zip
      - name: Unzip
        run: unzip -oq /tmp/bw.zip -d .
      - name: Remove bootstrap
        run: rm -f .github/workflows/bw-sync.yml
      - name: Commit
        run: |
          git config user.name duwutao
          git config user.email duwutao@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "骑砍化规则：12轮续战、山寨洗劫、村庄限额、铁骑追杀与文案"
          git push origin HEAD:main
