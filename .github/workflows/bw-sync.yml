name: bw-sync j
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply j patch and rebuild
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/a5T0OrsR0i" -o /tmp/bw-j.patch
          git apply --check /tmp/bw-j.patch
          git apply /tmp/bw-j.patch
          node tools/bundle.js
          node tools/logic-test.js
          node tools/render-smoke.js
      - name: Commit release and remove temporary workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bw-sync.yml
          git add -A
          git commit -m "release: 20261125j 地形重制·宽山脉·跨河桥·新城图 [skip ci]"
          git push origin HEAD:main
