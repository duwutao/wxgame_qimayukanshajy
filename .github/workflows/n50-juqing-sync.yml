name: n50 juqing sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n50-juqing-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source
        run: |
          set +e
          (
            set -e
            curl --http1.1 -L --fail --retry 3 --retry-delay 2 -o /tmp/n50src.tgz 'https://aka.doubaocdn.com/s/QqdedC089e'
            echo '120aa521af63d34adfc201ec1f6096beb1f1e6755ad1aceb2885c75ab2882850  /tmp/n50src.tgz' | sha256sum -c -
            tar xzf /tmp/n50src.tgz
            node tools/logic-test.js
            node tools/story-test.js
            node tools/render-smoke.js
            node tools/minigame-check.js
          ) > /tmp/ci.log 2>&1
          code=$?
          echo "EXIT=$code" >> /tmp/ci.log
          tail -60 /tmp/ci.log
          if [ $code -ne 0 ]; then cp /tmp/ci.log ci-fail.log; fi
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          if [ -f ci-fail.log ]; then
            git commit -m 'debug: n50 juqing 失败日志 [skip ci]'
          else
            git commit -m 'release: 20261127n50 军机棋盘六局与史实配图 [skip ci]'
          fi
          git push origin HEAD:juqing
