name: BW n5 publish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'chore: temporary n5 sync workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download patch
        run: curl -fsSL https://aka.doubaocdn.com/s/BnFiBRGWH9 -o /tmp/bw-n5.patch

      - name: Apply patch
        run: |
          git apply --check /tmp/bw-n5.patch
          git apply /tmp/bw-n5.patch

      - name: Tests
        run: |
          node tools/logic-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js

      - name: Commit and push n5
        run: |
          git config user.name "bw-release-bot"
          git config user.email "bw-release-bot@users.noreply.github.com"
          git add index.html web/index.html js/core/state.js tools/logic-test.js web/game.bundle.js
          git rm .github/workflows/bw-n5-publish.yml
          git commit -m "release: 20261125n5 NPC 绕城寻路 [skip ci]"
          git push origin main
