name: bw-sync m
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply m patch and rebuild
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/rIFVaQgCoN" -o /tmp/bw-m.patch
          git apply --check /tmp/bw-m.patch
          git apply /tmp/bw-m.patch
          node tools/bundle.js
          node tools/logic-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Commit release and remove temporary workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bw-m-sync.yml
          git add -A
          git commit -m "release: 20261125m 交战对象互抢修复 [skip ci]"
          git push origin HEAD:main
