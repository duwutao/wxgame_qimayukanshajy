name: n70 build game_1
on:
  push:
    branches: [game_1]
    paths:
      - '.github/workflows/n70-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n70 patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/game1-n70.patch 'https://aka.doubaocdn.com/s/L2ofA6UrLy'
          git apply --check /tmp/game1-n70.patch
          git apply /tmp/game1-n70.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Commit n70
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/core/state.js js/core/story.js js/core/war.js js/data/story.js tools/story-test.js web/index.html web/game.bundle.js
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release(game_1): 官渡赤壁打满七日 [skip ci]'
          git push origin HEAD:game_1
# trigger
