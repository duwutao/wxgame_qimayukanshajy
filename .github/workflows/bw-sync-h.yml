name: bw-sync-h

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download source patch
        run: |
          curl -4 -L --fail --retry 2 --connect-timeout 10 --max-time 40 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36' \
            -o /tmp/bw-h.patch 'https://aka.doubaocdn.com/s/XuEVyayQMp'
          test -s /tmp/bw-h.patch
          git apply --check /tmp/bw-h.patch
      - name: Apply patch and build bundle
        run: |
          git apply --whitespace=nowarn /tmp/bw-h.patch
          node tools/bundle.js
          git status --short
      - name: Commit release
        run: |
          git config user.name "bw-release-bot"
          git config user.email "bw-release-bot@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes"
            exit 0
          fi
          git commit -m "release: 20261124h [skip ci]"
          git push
