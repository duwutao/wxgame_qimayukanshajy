name: n41 build juqing
on:
  push:
    branches: [juqing]
    paths:
      - '.github/workflows/n41-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juqing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n41 patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/juqing-n41.patch 'https://aka.doubaocdn.com/s/vwE4ULKF2E'
          git apply --check /tmp/juqing-n41.patch
          git apply /tmp/juqing-n41.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Verify bundle
        run: echo 'ccbc2ff1a05d83bb31d5aa6ebe6139e4fcdcbb8dc9c4c18e6afff61be2d69e72  web/game.bundle.js' | sha256sum -c -
      - name: Commit n41
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/core/battle.js js/core/state.js js/core/war.js js/data/china.js js/data/story.js js/scenes/battle.js js/scenes/help.js tools/logic-test.js tools/render-smoke.js tools/story-test.js web/game.bundle.js web/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261126n41 成都重心/天机简/马超归蜀/韩遂灭凉 [skip ci]'
          git push origin HEAD:juqing
