name: n74 build game_1
on:
  push:
    branches: [game_1]
    paths:
      - '.github/workflows/n74-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: game_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply n74 source patch
        run: |
          curl --http1.1 -L --retry 3 --fail -o /tmp/n74-src.patch 'https://aka.doubaocdn.com/s/B6CC6lVXHP'
          git apply --check /tmp/n74-src.patch
          git apply /tmp/n74-src.patch
      - name: Test
        run: |
          node tools/logic-test.js
          node tools/story-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Build bundle
        run: node tools/bundle.js
      - name: Verify bundle
        run: node --check web/game.bundle.js && sha256sum web/game.bundle.js
      - name: Commit n74
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js tools web/game.bundle.js web/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'release: 20261128n74 官渡赤壁渐进伤亡与国战主动攻城 [skip ci]'
          git push origin HEAD:game_1
