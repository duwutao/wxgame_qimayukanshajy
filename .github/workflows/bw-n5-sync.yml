name: bw-n5-sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download patch
        run: curl -fsSL https://aka.doubaocdn.com/s/BnFiBRGWH9 -o /tmp/bw-n5.patch
      - name: Apply and test
        run: |
          git apply --check /tmp/bw-n5.patch
          git apply /tmp/bw-n5.patch
          node tools/logic-test.js
          node tools/render-smoke.js
          node tools/minigame-check.js
      - name: Commit and push
        run: |
          git config user.name 'bw-release-bot'
          git config user.email 'bw-release-bot@users.noreply.github.com'
          rm -f .github/workflows/bw-n5-sync.yml .github/workflows/bw-n5-publish.yml
          git add -A
          git commit -m 'release: 20261125n5 NPC 绕城寻路 [skip ci]'
          git push origin HEAD:main
