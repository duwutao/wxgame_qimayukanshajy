<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14100c" />
  <title>骑砍大师 · 三国</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #100d0a;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    body { position: relative; }
    #stage {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * 0.5625));
      height: min(100vh, calc(100vw / 0.5625));
      background: #14100c;
      overflow: hidden;
      box-shadow: 0 0 0 1px #2a2118, 0 18px 60px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script src="./game.bundle.js"></script>
</body>
</html>
