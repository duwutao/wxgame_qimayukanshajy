<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14100c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>征战汉末</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #100d0a;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* 手机满屏（竖屏铺满，避开刘海与底部横条）；屏幕变宽时按 3:4 上限居中，避免界面被压扁 */
    #stage {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: 50%;
      transform: translateX(-50%);
      width: min(100vw, 75vh);
      width: min(100vw, 75dvh);
      background: #14100c;
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 0 0 1px #241d15;
    }
    #boot {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 45%, #241a12 0%, #100d0a 70%);
      color: #c9bda2;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      letter-spacing: 2px;
    }
    #boot b {
      color: #f0c060;
      font-size: 26px;
      letter-spacing: 6px;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="boot"><b>征战汉末</b><span>正在聚兵，请稍候…</span></div>
  </div>
  <script>
    /* 调试用：地址加 ?w=390&h=844 可在电脑上按指定手机分辨率预览 */
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var w = parseInt(p.get('w'), 10);
        var h = parseInt(p.get('h'), 10);
        if (!(w > 0 && h > 0)) return;
        var s = document.getElementById('stage');
        s.style.width = w + 'px';
        s.style.height = h + 'px';
        s.style.left = '0';
        s.style.top = '0';
        s.style.transformOrigin = 'top left';
        s.style.transform = 'scale(' + Math.min(1, window.innerWidth / w, window.innerHeight / h) + ')';
      } catch (e) {}
    })();
  </script>
  <script src="./game.bundle.js?v=20261127n49"></script>
</body>
</html>
